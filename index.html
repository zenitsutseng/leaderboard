<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>手工蛋餅車</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-dark:#241a12;
    --bg-panel:#3a2c1e;
    --bg-panel-2:#4a3a27;
    --steel:#8a8f92;
    --steel-dark:#5c6164;
    --cream:#f5e6c8;
    --cream-deep:#e7cf9c;
    --brown-cook:#c9902f;
    --brown-deep:#8f5a1d;
    --plate:#fffdf7;
    --yolk:#f0b429;
    --yolk-deep:#d9941f;
    --scallion:#4a7c59;
    --scallion-dark:#2f5238;
    --chili:#c1442e;
    --chili-dark:#8f2f1e;
    --soy:#5b3a22;
    --ink:#241a12;
    --paper:#f7f0dd;
    --gold:#e8b23d;
    --bad:#c1442e;
    --good:#4a7c59;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, #3a2c1e 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, #3a2c1e 0%, transparent 45%),
      var(--bg-dark);
    font-family:'Noto Sans TC', sans-serif;
    color:var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:14px;
  }
  .display{font-family:'Baloo 2', 'Noto Sans TC', sans-serif;}
  .mono{font-family:'Space Mono', monospace;}

  #app{
    width:100%;
    max-width:960px;
    background:linear-gradient(180deg, var(--bg-panel), #2f2416);
    border-radius:22px;
    box-shadow:0 20px 60px rgba(0,0,0,0.55), inset 0 0 0 2px rgba(232,178,61,0.15);
    overflow:hidden;
    position:relative;
  }

  /* ---------- HEADER / SIGN ---------- */
  header{
    background:
      repeating-linear-gradient(135deg, rgba(0,0,0,0.08) 0 10px, transparent 10px 20px),
      linear-gradient(180deg, #4a3423, #38271a);
    border-bottom:4px solid var(--gold);
    padding:12px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
  }
  .sign-title{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:26px;
    letter-spacing:1px;
    color:var(--gold);
    text-shadow:0 2px 0 #5c3d17, 0 0 18px rgba(232,178,61,0.25);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .sign-title .flame{font-size:22px; animation:flicker 1.6s infinite ease-in-out;}
  @keyframes flicker{0%,100%{transform:scale(1) rotate(-2deg);}50%{transform:scale(1.12) rotate(3deg);}}

  .hud{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .hud-chip{
    background:rgba(0,0,0,0.28);
    border:1px solid rgba(232,178,61,0.3);
    border-radius:10px;
    padding:6px 10px;
    font-size:13px;
    display:flex;
    align-items:center;
    gap:6px;
    white-space:nowrap;
  }
  .hud-chip b{font-family:'Space Mono',monospace; font-size:14px; color:var(--gold);}
  #stars{letter-spacing:1px;}
  #clock{min-width:52px; text-align:center;}
  #clock.warn{color:var(--bad); animation:pulse 0.6s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}

  /* ---------- MAIN LAYOUT ---------- */
  main{
    display:grid;
    grid-template-columns:230px 1fr;
    gap:16px;
    padding:16px 18px;
  }
  @media (max-width:680px){
    main{grid-template-columns:1fr;}
  }

  .side-col{display:flex; flex-direction:column; gap:12px;}

  /* order ticket */
  .ticket{
    background:var(--paper);
    color:var(--ink);
    border-radius:4px 4px 10px 10px;
    padding:12px 12px 14px;
    position:relative;
    box-shadow:0 6px 14px rgba(0,0,0,0.35);
    background-image:repeating-linear-gradient(0deg, transparent 0 22px, rgba(0,0,0,0.05) 22px 23px);
  }
  .ticket::before{
    content:'';
    position:absolute; top:-6px; left:10px; right:10px; height:10px;
    background:repeating-linear-gradient(90deg, transparent 0 8px, var(--bg-panel) 8px 10px);
    border-radius:4px 4px 0 0;
  }
  .ticket h3{
    margin:2px 0 8px; font-family:'Baloo 2',sans-serif; font-size:15px;
    border-bottom:2px dashed rgba(0,0,0,0.25); padding-bottom:6px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .ticket .order-no{color:var(--chili-dark); font-family:'Space Mono',monospace;}
  .ticket .row{font-size:13px; margin:5px 0; line-height:1.5;}
  .ticket .row b{font-weight:700;}
  .ticket .tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:4px;}
  .ticket .tag{
    background:var(--ink); color:var(--paper); font-size:11px;
    padding:2px 7px; border-radius:20px; font-weight:700;
  }
  .patience-bar{
    margin-top:10px; height:8px; border-radius:6px; background:rgba(0,0,0,0.15); overflow:hidden;
  }
  .patience-fill{
    height:100%; width:100%; background:var(--good); transition:width 0.2s linear, background 0.3s;
  }
  .no-order{
    text-align:center; padding:20px 8px; color:rgba(36,26,18,0.5); font-size:13px;
  }

  /* queue */
  .queue-title{font-size:11px; letter-spacing:1px; color:rgba(245,230,200,0.55); text-transform:uppercase; margin:0 0 2px 2px;}
  .queue{display:flex; gap:8px; flex-wrap:wrap;}
  .queue-cust{
    background:rgba(0,0,0,0.25); border:1px solid rgba(232,178,61,0.25);
    border-radius:10px; padding:6px 8px; font-size:11px; min-width:64px;
    display:flex; flex-direction:column; gap:4px; align-items:center;
  }
  .queue-cust .face{font-size:18px;}
  .queue-cust .pbar{width:100%; height:5px; border-radius:4px; background:rgba(0,0,0,0.3); overflow:hidden;}
  .queue-cust .pbar i{display:block; height:100%; background:var(--good);}

  .combo-box{
    background:rgba(0,0,0,0.22); border-radius:10px; padding:8px 10px; font-size:12px;
    display:flex; justify-content:space-between; align-items:center;
    border:1px solid rgba(232,178,61,0.2);
  }
  .combo-box b{color:var(--gold); font-family:'Space Mono',monospace; font-size:15px;}

  /* ---------- GRILL STAGE ---------- */
  .stage{
    background:radial-gradient(circle at 50% 30%, #46362472, transparent 60%), var(--bg-panel-2);
    border-radius:16px;
    padding:16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    position:relative;
    min-height:340px;
  }
  .grill-wrap{
    position:relative;
    width:260px; height:260px;
    margin-top:6px;
  }
  .grill{
    width:100%; height:100%; border-radius:50%;
    background:
      radial-gradient(circle at 38% 32%, #9a9fa2 0%, #6d7275 35%, #4a4e50 75%, #3a3d3f 100%);
    box-shadow:
      inset 0 0 0 10px #2e2a24,
      inset 0 -14px 30px rgba(0,0,0,0.5),
      inset 0 10px 24px rgba(255,255,255,0.08),
      0 10px 24px rgba(0,0,0,0.5);
    position:relative;
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .grill::after{
    content:'';
    position:absolute; inset:0;
    background:repeating-radial-gradient(circle at 50% 50%, transparent 0 14px, rgba(0,0,0,0.05) 14px 15px);
    pointer-events:none;
  }
  .heat-glow{
    position:absolute; inset:14px; border-radius:50%;
    box-shadow:0 0 30px 6px rgba(255,120,40,0.25) inset;
    opacity:0; transition:opacity 0.4s;
    pointer-events:none;
  }
  .heat-glow.on{opacity:1; animation:heatpulse 1.4s infinite ease-in-out;}
  @keyframes heatpulse{0%,100%{box-shadow:0 0 26px 4px rgba(255,120,40,0.22) inset;}50%{box-shadow:0 0 40px 10px rgba(255,140,40,0.36) inset;}}

  .pancake{
    position:absolute;
    width:0; height:0;
    border-radius:50%;
    background:var(--cream);
    left:50%; top:50%;
    transform:translate(-50%,-50%);
    transition:width 0.45s cubic-bezier(.2,.9,.3,1.2), height 0.45s cubic-bezier(.2,.9,.3,1.2), border-radius 0.5s ease, background 0.4s ease, box-shadow 0.4s;
    display:flex; align-items:center; justify-content:center;
  }
  .pancake.show{width:200px; height:200px;}
  .pancake.rolled{width:210px; height:52px; border-radius:26px;}
  .egg-layer{
    position:absolute; inset:14%;
    border-radius:50%;
    background:radial-gradient(circle at 45% 40%, #fff 30%, rgba(255,255,255,0) 65%);
    opacity:0; transform:scale(0.3);
    transition:opacity 0.4s, transform 0.5s cubic-bezier(.3,1.4,.4,1);
  }
  .egg-layer.show{opacity:0.92; transform:scale(1);}
  .yolk{
    position:absolute; width:26%; height:26%; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffd873, var(--yolk) 60%, var(--yolk-deep) 100%);
    left:50%; top:50%; transform:translate(-50%,-50%) scale(0);
    box-shadow:0 0 6px rgba(0,0,0,0.2);
    transition:transform 0.5s cubic-bezier(.3,1.6,.4,1);
  }
  .yolk.show{transform:translate(-50%,-50%) scale(1);}

  .fillings-layer{position:absolute; inset:0;}
  .fchip{
    position:absolute; font-size:22px;
    transform:scale(0); transition:transform 0.35s cubic-bezier(.3,1.6,.4,1);
    filter:drop-shadow(0 2px 2px rgba(0,0,0,0.35));
  }
  .fchip.show{transform:scale(1);}

  .sauce-layer{position:absolute; inset:0; border-radius:50%; overflow:hidden;}
  .sauce-line{
    position:absolute; height:6px; border-radius:4px; opacity:0; transition:opacity 0.3s;
    transform:rotate(-18deg);
  }
  .sauce-line.show{opacity:0.88;}

  .slices{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    display:flex; gap:6px; opacity:0; pointer-events:none;
  }
  .slices.show{opacity:1;}
  .slice{
    width:32px; height:46px; border-radius:8px;
    background:repeating-radial-gradient(circle at 50% 50%, var(--cream) 0 5px, var(--brown-cook) 5px 9px, var(--cream) 9px 13px);
    box-shadow:0 3px 6px rgba(0,0,0,0.4);
    transform:translateY(18px) scale(0.4); opacity:0;
    transition:transform 0.4s cubic-bezier(.3,1.6,.4,1), opacity 0.3s;
  }
  .slices.show .slice{transform:translateY(0) scale(1); opacity:1;}
  .slice:nth-child(1){transition-delay:.02s;}
  .slice:nth-child(2){transition-delay:.08s;}
  .slice:nth-child(3){transition-delay:.14s;}
  .slice:nth-child(4){transition-delay:.20s;}
  .slice:nth-child(5){transition-delay:.26s;}

  .cook-ring{
    position:absolute; width:100%; height:100%; border-radius:50%;
    left:0; top:0;
    background:conic-gradient(var(--gold) calc(var(--p,0)*1%), rgba(255,255,255,0.08) 0);
    -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 5px));
    mask:radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 5px));
    opacity:0; transition:opacity 0.2s;
    pointer-events:none;
  }
  .cook-ring.show{opacity:1;}

  .float-text{
    position:absolute; left:50%; top:30%; transform:translate(-50%,0);
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:22px;
    color:var(--gold); text-shadow:0 2px 4px rgba(0,0,0,0.6);
    pointer-events:none; opacity:0; white-space:nowrap;
  }
  .float-text.pop{animation:floatUp 1.1s ease-out forwards;}
  @keyframes floatUp{
    0%{opacity:0; transform:translate(-50%,10px) scale(0.7);}
    15%{opacity:1; transform:translate(-50%,-6px) scale(1.08);}
    75%{opacity:1; transform:translate(-50%,-46px) scale(1);}
    100%{opacity:0; transform:translate(-50%,-70px) scale(0.95);}
  }

  .stage-hint{
    margin-top:12px; font-size:13px; color:var(--gold); text-align:center; min-height:18px;
    font-weight:700;
  }

  /* ---------- CONTROLS ---------- */
  .controls{
    margin-top:14px; display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
    width:100%;
  }
  .btn{
    border:none; border-radius:12px; padding:9px 14px; font-size:13px;
    font-family:'Noto Sans TC',sans-serif; font-weight:700; cursor:pointer;
    background:linear-gradient(180deg,#5c4a34,#493a28);
    color:rgba(245,230,200,0.4);
    display:flex; align-items:center; gap:6px;
    box-shadow:0 3px 0 rgba(0,0,0,0.35);
    transition:transform 0.12s, box-shadow 0.12s, background 0.2s, color 0.2s;
    opacity:0.55;
  }
  .btn .ic{font-size:16px;}
  .btn.enabled{
    background:linear-gradient(180deg,#e8b23d,#c98a1f);
    color:#2b1d08; opacity:1; cursor:pointer;
  }
  .btn.enabled:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,0.35);}
  .btn.toggled{
    background:linear-gradient(180deg,#4a7c59,#33573e); color:#eaf5ec;
  }
  .btn:disabled{cursor:not-allowed;}
  .btn.serve{
    background:linear-gradient(180deg,#c1442e,#8f2f1e); color:#fff0ea;
  }
  .btn.serve.enabled{background:linear-gradient(180deg,#e8683d,#b8391f);}

  /* ---------- OVERLAYS ---------- */
  .overlay{
    position:absolute; inset:0; background:rgba(20,14,8,0.86);
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    text-align:center; padding:24px; z-index:20; opacity:0; pointer-events:none;
    transition:opacity 0.35s;
  }
  .overlay.show{opacity:1; pointer-events:auto;}
  .overlay h2{font-family:'Baloo 2',sans-serif; color:var(--gold); font-size:30px; margin:0 0 6px;}
  .overlay p{color:var(--cream); font-size:14px; max-width:360px; line-height:1.6; margin:4px 0 18px;}
  .overlay .stats{display:flex; gap:18px; margin-bottom:18px; flex-wrap:wrap; justify-content:center;}
  .overlay .stat{background:rgba(255,255,255,0.06); border-radius:10px; padding:10px 16px;}
  .overlay .stat b{display:block; font-family:'Space Mono',monospace; font-size:20px; color:var(--gold);}
  .overlay .stat span{font-size:11px; opacity:0.7;}
  .overlay .bigbtn{
    background:linear-gradient(180deg,#e8b23d,#c98a1f); color:#2b1d08; border:none;
    padding:12px 26px; border-radius:30px; font-family:'Baloo 2',sans-serif; font-weight:700;
    font-size:16px; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,0.35);
  }
  .overlay .bigbtn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,0.35);}
  .overlay .bigbtn.small{padding:9px 18px; font-size:14px; box-shadow:0 3px 0 rgba(0,0,0,0.35);}

  .score-submit{
    display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center;
    margin-bottom:6px;
  }
  .nick-input{
    font-family:'Noto Sans TC',sans-serif; font-size:14px;
    padding:9px 12px; border-radius:20px; border:none;
    background:rgba(255,255,255,0.92); color:var(--ink);
    width:170px; text-align:center;
  }
  .nick-input:focus{outline:2px solid var(--gold);}
  .submit-msg{
    width:100%; text-align:center; font-size:12px; min-height:16px; color:var(--gold);
  }
  .submit-msg.err{color:var(--bad);}
  .submit-msg.ok{color:var(--good);}

  .lb-toggle-row{margin-bottom:6px;}
  .linkbtn{
    background:none; border:none; color:var(--cream); opacity:0.75;
    font-size:12px; cursor:pointer; text-decoration:underline;
    font-family:'Noto Sans TC',sans-serif;
  }
  .linkbtn:hover{opacity:1;}

  .leaderboard{
    background:rgba(0,0,0,0.28); border:1px solid rgba(232,178,61,0.3);
    border-radius:12px; padding:10px 14px; margin-bottom:16px;
    width:100%; max-width:320px; max-height:220px; overflow-y:auto;
  }
  .lb-title{font-family:'Baloo 2',sans-serif; color:var(--gold); font-size:14px; margin-bottom:6px; text-align:center;}
  #lbList{margin:0; padding-left:22px; text-align:left; font-size:13px;}
  #lbList li{margin:4px 0; display:flex; justify-content:space-between; gap:10px;}
  #lbList li span.n{opacity:0.85;}
  #lbList li span.s{font-family:'Space Mono',monospace; color:var(--gold); font-weight:700;}
  .lb-empty{font-size:12px; opacity:0.6; text-align:center; padding:6px 0;}

  .side-lb{
    background:rgba(0,0,0,0.22); border:1px solid rgba(232,178,61,0.2);
    border-radius:10px; padding:8px 10px 10px; max-height:220px; overflow-y:auto;
  }
  .side-lb-list{margin:6px 0 0; padding-left:20px; font-size:12px;}
  .side-lb-list li{margin:4px 0; display:flex; justify-content:space-between; gap:8px;}
  .side-lb-list li .n{opacity:0.85; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:90px;}
  .side-lb-list li .s{font-family:'Space Mono',monospace; color:var(--gold); font-weight:700; flex-shrink:0;}
  .side-lb-list li.me{color:var(--gold);}
  .lb-empty-row{list-style:none; margin-left:-20px; font-size:12px; opacity:0.55; text-align:center;}

  footer{
    text-align:center; font-size:11px; color:rgba(245,230,200,0.35); padding:8px 0 12px;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="sign-title"><span class="flame">🔥</span>手工蛋餅車</div>
    <div class="hud">
      <div class="hud-chip">💰 <b id="money">0</b></div>
      <div class="hud-chip">☀️ Day <b id="day">1</b></div>
      <div class="hud-chip" id="stars">⭐⭐⭐⭐⭐</div>
      <div class="hud-chip">⏱ <b id="clock" class="mono">2:00</b></div>
    </div>
  </header>

  <main>
    <div class="side-col">
      <div class="queue-title">排隊中</div>
      <div class="queue" id="queue"></div>

      <div class="combo-box">連續完美 <b id="combo">0</b></div>

      <div class="ticket" id="ticket">
        <div class="no-order">目前沒有點單<br>等待客人上門…</div>
      </div>

      <div class="side-lb" id="sideLb">
        <div class="queue-title">🏆 今日 TOP 10</div>
        <ol id="sideLbList" class="side-lb-list"><li class="lb-empty-row">載入中…</li></ol>
      </div>
    </div>

    <div class="stage">
      <div class="grill-wrap">
        <div class="grill">
          <div class="heat-glow" id="heatGlow"></div>
          <div class="cook-ring" id="cookRing"></div>
          <div class="pancake" id="pancake">
            <div class="egg-layer" id="eggLayer"></div>
            <div class="yolk" id="yolk"></div>
            <div class="fillings-layer" id="fillingsLayer"></div>
            <div class="sauce-layer" id="sauceLayer"></div>
          </div>
          <div class="slices" id="slices"></div>
        </div>
        <div class="float-text" id="floatText"></div>
      </div>
      <div class="stage-hint" id="stageHint">點擊「倒麵糊」開始製作</div>

      <div class="controls" id="controls">
        <button class="btn" data-act="batter"><span class="ic">🥣</span>倒麵糊</button>
        <button class="btn" data-act="egg"><span class="ic">🥚</span>打蛋</button>
        <button class="btn" data-act="fill" data-key="cheese"><span class="ic">🧀</span>起司</button>
        <button class="btn" data-act="fill" data-key="corn"><span class="ic">🌽</span>玉米</button>
        <button class="btn" data-act="fill" data-key="bacon"><span class="ic">🥓</span>培根</button>
        <button class="btn" data-act="fill" data-key="lettuce"><span class="ic">🥬</span>生菜</button>
        <button class="btn" data-act="sauce" data-key="soy"><span class="ic">🟤</span>醬油膏</button>
        <button class="btn" data-act="sauce" data-key="chili"><span class="ic">🌶️</span>辣椒醬</button>
        <button class="btn" data-act="roll"><span class="ic">🌀</span>捲起來</button>
        <button class="btn" data-act="cut"><span class="ic">🔪</span>切一切</button>
        <button class="btn serve" data-act="serve"><span class="ic">🍽️</span>上菜</button>
      </div>
    </div>
  </main>

  <footer>方向鍵不用，滑鼠／觸控點按鈕即可 · 依照點單正確配料並儘快上菜可得高分</footer>

  <div class="overlay show" id="startOverlay">
    <h2>手工蛋餅車</h2>
    <p>今天的早餐生意開張啦！照著點單依序：倒麵糊 → 打蛋 → 加配料／醬料 → 捲起來 → 切一切 → 上菜。<br>配料要對、動作要快，客人的耐心可是有限的！</p>
    <button class="bigbtn" id="startBtn">開始營業 🍳</button>
  </div>

  <div class="overlay" id="endOverlay">
    <h2 id="endTitle">今日打烊！</h2>
    <div class="stats">
      <div class="stat"><b id="endMoney">0</b><span>營收 $</span></div>
      <div class="stat"><b id="endServed">0</b><span>服務人數</span></div>
      <div class="stat"><b id="endBestCombo">0</b><span>最高連續完美</span></div>
    </div>
    <p id="endComment"></p>

    <div class="score-submit" id="scoreSubmit">
      <input id="nicknameInput" class="nick-input" type="text" maxlength="12" placeholder="輸入暱稱上傳分數">
      <button class="bigbtn small" id="submitScoreBtn">上傳分數 🏆</button>
      <div class="submit-msg" id="submitMsg"></div>
    </div>

    <div class="lb-toggle-row">
      <button class="linkbtn" id="showLbBtn">查看排行榜 »</button>
    </div>
    <div class="leaderboard" id="leaderboardBox" style="display:none;">
      <div class="lb-title">🏆 排行榜 TOP 10</div>
      <ol id="lbList"></ol>
    </div>

    <button class="bigbtn" id="restartBtn">再開一天 🔁</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ---------- CONFIG ----------
  const FILLING_POOL = [
    {key:'cheese', label:'起司', icon:'🧀'},
    {key:'corn', label:'玉米', icon:'🌽'},
    {key:'bacon', label:'培根', icon:'🥓'},
    {key:'lettuce', label:'生菜', icon:'🥬'},
  ];
  const SAUCE_POOL = [
    {key:'soy', label:'醬油膏', color:'#5b3a22'},
    {key:'chili', label:'辣椒醬', color:'#c1442e'},
  ];
  const SHIFT_SECONDS = 120;
  const BATTER_COOK_MS = 1500;
  const EGG_COOK_MS = 1100;
  const MAX_QUEUE = 3;
  const SPAWN_MIN = 3200, SPAWN_MAX = 5200;
  const BASE_PATIENCE = 24000; // ms, reduced per day
  const API_BASE = "https://egg-crepe-leaderboard.zentisu.workers.dev";

  // ---------- STATE ----------
  let money=0, day=1, rating=5, comboCount=0, bestCombo=0, served=0;
  let shiftMsLeft = SHIFT_SECONDS*1000;
  let running=false, spawnTimer=null, tickTimer=null;
  let queue=[]; // waiting customers {id, order, patienceLeft, patienceTotal}
  let current=null; // active order being cooked, same shape + arrivedAt
  let pan = null; // pancake cook state
  let nextId=1;

  // ---------- DOM ----------
  const $ = s=>document.querySelector(s);
  const moneyEl=$('#money'), dayEl=$('#day'), starsEl=$('#stars'), clockEl=$('#clock');
  const queueEl=$('#queue'), ticketEl=$('#ticket'), comboEl=$('#combo');
  const pancakeEl=$('#pancake'), eggLayerEl=$('#eggLayer'), yolkEl=$('#yolk');
  const fillingsLayerEl=$('#fillingsLayer'), sauceLayerEl=$('#sauceLayer');
  const slicesEl=$('#slices'), cookRingEl=$('#cookRing'), heatGlowEl=$('#heatGlow');
  const stageHintEl=$('#stageHint'), floatTextEl=$('#floatText');
  const controlsEl=$('#controls');
  const startOverlay=$('#startOverlay'), endOverlay=$('#endOverlay');
  const nicknameInput=$('#nicknameInput'), submitScoreBtn=$('#submitScoreBtn'), submitMsg=$('#submitMsg');
  const showLbBtn=$('#showLbBtn'), leaderboardBox=$('#leaderboardBox'), lbList=$('#lbList');
  const sideLbList=$('#sideLbList');

  const FILLING_POS = {
    cheese:{left:'22%', top:'26%'}, corn:{left:'62%', top:'22%'},
    bacon:{left:'26%', top:'62%'}, lettuce:{left:'62%', top:'62%'},
  };

  // ---------- HELPERS ----------
  function fmtTime(ms){
    const s = Math.max(0, Math.ceil(ms/1000));
    const m = Math.floor(s/60), r = s%60;
    return m+':'+String(r).padStart(2,'0');
  }
  function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
  function pick(arr,n){
    const c=[...arr]; const out=[];
    n=Math.min(n,c.length);
    while(out.length<n){ out.push(c.splice(rand(0,c.length-1),1)[0]); }
    return out;
  }
  function floatMsg(text, color){
    floatTextEl.textContent=text;
    floatTextEl.style.color = color||'var(--gold)';
    floatTextEl.classList.remove('pop');
    void floatTextEl.offsetWidth;
    floatTextEl.classList.add('pop');
  }

  // ---------- ORDER GENERATION ----------
  function makeOrder(){
    const fillCount = rand(1, day>=2?3:2);
    const fills = pick(FILLING_POOL, fillCount).map(f=>f.key);
    let sauces=[];
    if(day>=1 && Math.random()<0.6){
      sauces = pick(SAUCE_POOL, Math.random()<0.25 && day>=3 ? 2:1).map(s=>s.key);
    }
    const patienceTotal = Math.max(13000, BASE_PATIENCE - (day-1)*1800);
    return {
      id:nextId++,
      fills, sauces,
      patienceTotal,
      patienceLeft:patienceTotal,
      face: pick(['🧑','👩','👨','🧕','👴','👵','🧑‍🦱','👩‍🦰','🧑‍🎓'],1)[0],
    };
  }

  function spawnCustomer(){
    if(!running) return;
    if(queue.length < MAX_QUEUE){
      queue.push(makeOrder());
      renderQueue();
    }
    scheduleSpawn();
  }
  function scheduleSpawn(){
    clearTimeout(spawnTimer);
    if(!running) return;
    const delay = Math.max(1400, rand(SPAWN_MIN, SPAWN_MAX) - day*250);
    spawnTimer = setTimeout(spawnCustomer, delay);
  }

  function promoteQueue(){
    if(!current && queue.length){
      current = queue.shift();
      current.startedAt = performance.now();
      resetPancake();
      renderTicket();
    }
  }

  // ---------- PANCAKE STATE MACHINE ----------
  function resetPancake(){
    pan = {stage:'empty', cookProgress:0, eggProgress:0, fills:new Set(), sauces:new Set()};
    pancakeEl.className='pancake';
    pancakeEl.style.background='var(--cream)';
    eggLayerEl.classList.remove('show');
    yolkEl.classList.remove('show');
    fillingsLayerEl.innerHTML='';
    sauceLayerEl.innerHTML='';
    slicesEl.classList.remove('show');
    slicesEl.innerHTML='';
    cookRingEl.classList.remove('show');
    heatGlowEl.classList.remove('on');
    updateHint();
    updateButtons();
  }

  function updateHint(){
    if(!current){ stageHintEl.textContent='等待客人點餐…'; return; }
    const map = {
      empty:'點擊「倒麵糊」開始製作',
      cooking:'麵糊煎製中…',
      readyEgg:'點擊「打蛋」',
      eggCooking:'蛋液煎製中…',
      readyFill:'依點單加入配料與醬料',
      rolled:'點擊「切一切」',
      cut:'點擊「上菜」送出！',
    };
    stageHintEl.textContent = map[pan.stage] || '';
  }

  function updateButtons(){
    const btns = [...controlsEl.querySelectorAll('.btn')];
    btns.forEach(b=>{
      const act=b.dataset.act;
      let enabled=false, toggled=false;
      if(!pan){ b.classList.remove('enabled','toggled'); return; }
      if(act==='batter') enabled = pan.stage==='empty';
      if(act==='egg') enabled = pan.stage==='readyEgg';
      if(act==='fill'){
        enabled = pan.stage==='readyFill';
        toggled = pan.fills.has(b.dataset.key);
      }
      if(act==='sauce'){
        enabled = pan.stage==='readyFill';
        toggled = pan.sauces.has(b.dataset.key);
      }
      if(act==='roll') enabled = pan.stage==='readyFill';
      if(act==='cut') enabled = pan.stage==='rolled';
      if(act==='serve') enabled = pan.stage==='cut';
      b.classList.toggle('enabled', enabled);
      b.classList.toggle('toggled', toggled);
      b.disabled = !enabled;
    });
  }

  function doAction(act, key){
    if(!current || !pan) return;
    if(act==='batter' && pan.stage==='empty'){
      pan.stage='cooking';
      pancakeEl.classList.add('show');
      heatGlowEl.classList.add('on');
      cookRingEl.classList.add('show');
      cookRingEl.style.setProperty('--p',0);
      const start=performance.now();
      pan.batterTimer = setInterval(()=>{
        const t=Math.min(1,(performance.now()-start)/BATTER_COOK_MS);
        cookRingEl.style.setProperty('--p', Math.round(t*100));
        const mix = mixColor('#f5e6c8','#c9902f', t);
        pancakeEl.style.background = mix;
        if(t>=1){
          clearInterval(pan.batterTimer);
          pan.stage='readyEgg';
          cookRingEl.classList.remove('show');
          updateHint(); updateButtons();
        }
      }, 60);
      updateHint(); updateButtons();
    }
    else if(act==='egg' && pan.stage==='readyEgg'){
      pan.stage='eggCooking';
      eggLayerEl.classList.add('show');
      yolkEl.classList.add('show');
      cookRingEl.classList.add('show');
      cookRingEl.style.setProperty('--p',0);
      const start=performance.now();
      pan.eggTimer=setInterval(()=>{
        const t=Math.min(1,(performance.now()-start)/EGG_COOK_MS);
        cookRingEl.style.setProperty('--p', Math.round(t*100));
        eggLayerEl.style.opacity = 0.5 + t*0.45;
        if(t>=1){
          clearInterval(pan.eggTimer);
          pan.stage='readyFill';
          cookRingEl.classList.remove('show');
          heatGlowEl.classList.remove('on');
          updateHint(); updateButtons();
        }
      }, 60);
      updateHint(); updateButtons();
    }
    else if(act==='fill' && pan.stage==='readyFill'){
      if(pan.fills.has(key)){
        pan.fills.delete(key);
        const el = fillingsLayerEl.querySelector('[data-key="'+key+'"]');
        if(el){ el.classList.remove('show'); setTimeout(()=>el.remove(),300); }
      } else {
        pan.fills.add(key);
        const f = FILLING_POOL.find(x=>x.key===key);
        const chip=document.createElement('div');
        chip.className='fchip'; chip.dataset.key=key; chip.textContent=f.icon;
        const pos=FILLING_POS[key]||{left:'45%',top:'45%'};
        chip.style.left=pos.left; chip.style.top=pos.top;
        fillingsLayerEl.appendChild(chip);
        requestAnimationFrame(()=>chip.classList.add('show'));
      }
      updateButtons();
    }
    else if(act==='sauce' && pan.stage==='readyFill'){
      if(pan.sauces.has(key)){
        pan.sauces.delete(key);
        const el = sauceLayerEl.querySelector('[data-key="'+key+'"]');
        if(el){ el.classList.remove('show'); setTimeout(()=>el.remove(),300); }
      } else {
        pan.sauces.add(key);
        const s = SAUCE_POOL.find(x=>x.key===key);
        const idx = pan.sauces.size;
        const line=document.createElement('div');
        line.className='sauce-line'; line.dataset.key=key;
        line.style.background = s.color;
        line.style.width='70%'; line.style.left='14%';
        line.style.top=(30+idx*18)+'%';
        sauceLayerEl.appendChild(line);
        requestAnimationFrame(()=>line.classList.add('show'));
      }
      updateButtons();
    }
    else if(act==='roll' && pan.stage==='readyFill'){
      pan.stage='rolled';
      pancakeEl.classList.add('rolled');
      updateHint(); updateButtons();
    }
    else if(act==='cut' && pan.stage==='rolled'){
      pan.stage='cut';
      pancakeEl.style.opacity='0';
      slicesEl.innerHTML='';
      const n=5;
      for(let i=0;i<n;i++){ const s=document.createElement('div'); s.className='slice'; slicesEl.appendChild(s); }
      requestAnimationFrame(()=>slicesEl.classList.add('show'));
      updateHint(); updateButtons();
    }
    else if(act==='serve' && pan.stage==='cut'){
      serveCurrent();
    }
  }

  function mixColor(c1,c2,t){
    const a=hexToRgb(c1), b=hexToRgb(c2);
    const r=Math.round(a.r+(b.r-a.r)*t), g=Math.round(a.g+(b.g-a.g)*t), bl=Math.round(a.b+(b.b-a.b)*t);
    return 'rgb('+r+','+g+','+bl+')';
  }
  function hexToRgb(h){
    h=h.replace('#','');
    return {r:parseInt(h.substring(0,2),16), g:parseInt(h.substring(2,4),16), b:parseInt(h.substring(4,6),16)};
  }

  // ---------- SCORING / SERVE ----------
  function serveCurrent(){
    if(!current) return;
    const wantFills=new Set(current.fills), wantSauces=new Set(current.sauces);
    let correct=0, wrong=0, missing=0;
    FILLING_POOL.forEach(f=>{
      const has=pan.fills.has(f.key), want=wantFills.has(f.key);
      if(want && has) correct++;
      else if(!want && has) wrong++;
      else if(want && !has) missing++;
    });
    SAUCE_POOL.forEach(s=>{
      const has=pan.sauces.has(s.key), want=wantSauces.has(s.key);
      if(want && has) correct++;
      else if(!want && has) wrong++;
      else if(want && !has) missing++;
    });
    const perfect = (wrong===0 && missing===0);
    let base=100 - wrong*22 - missing*28;
    base=Math.max(10, base);

    const elapsed = performance.now()-current.startedAt;
    const speedRatio = 1 - Math.min(1, elapsed/current.patienceTotal);
    const speedBonus = Math.round(speedRatio*50);

    if(perfect){ comboCount++; bestCombo=Math.max(bestCombo,comboCount); }
    else comboCount=0;
    const comboBonus = perfect ? Math.min(comboCount*8, 40) : 0;

    let total = base + speedBonus + comboBonus;
    money += total;
    served++;
    if(perfect) rating = Math.min(5, rating + 0.06);
    else rating = Math.max(1, rating - 0.15);

    floatMsg((perfect?'完美！ ':'')+'+'+total, perfect?'#e8b23d':'#d9d0b4');
    renderHud();

    current=null;
    setTimeout(()=>{ resetPancake(); promoteQueue(); renderQueue(); renderTicket(); }, 550);
  }

  function loseCurrentToImpatience(cust, wasCurrent){
    rating = Math.max(1, rating - 0.35);
    comboCount=0;
    renderHud();
    if(wasCurrent){
      current=null;
      clearInterval(pan && pan.batterTimer);
      clearInterval(pan && pan.eggTimer);
      resetPancake();
      promoteQueue();
      renderTicket();
    }
    renderQueue();
  }

  // ---------- RENDER ----------
  function renderHud(){
    moneyEl.textContent=money;
    dayEl.textContent=day;
    const full=Math.round(rating);
    starsEl.textContent='⭐'.repeat(full)+'☆'.repeat(5-full);
    comboEl.textContent=comboCount;
    clockEl.textContent=fmtTime(shiftMsLeft);
    clockEl.classList.toggle('warn', shiftMsLeft<15000);
  }

  function labelFills(order){
    if(!order.fills.length) return '無配料（原味）';
    return order.fills.map(k=>FILLING_POOL.find(f=>f.key===k).label).join('、');
  }
  function labelSauces(order){
    if(!order.sauces.length) return '不加醬';
    return order.sauces.map(k=>SAUCE_POOL.find(s=>s.key===k).label).join('、');
  }

  function renderTicket(){
    if(!current){
      ticketEl.innerHTML='<div class="no-order">目前沒有點單<br>等待客人上門…</div>';
      return;
    }
    ticketEl.innerHTML =
      '<h3>點單 <span class="order-no">#'+current.id+'</span></h3>'+
      '<div class="row"><b>配料：</b>'+labelFills(current)+'</div>'+
      '<div class="row"><b>醬料：</b>'+labelSauces(current)+'</div>'+
      '<div class="tags">'+current.fills.map(k=>'<span class="tag">'+FILLING_POOL.find(f=>f.key===k).icon+' '+FILLING_POOL.find(f=>f.key===k).label+'</span>').join('')+
        current.sauces.map(k=>'<span class="tag">'+(k==='chili'?'🌶️':'🟤')+' '+SAUCE_POOL.find(s=>s.key===k).label+'</span>').join('')+'</div>'+
      '<div class="patience-bar"><div class="patience-fill" id="curPatience"></div></div>';
  }

  function renderQueue(){
    queueEl.innerHTML='';
    if(!queue.length){
      queueEl.innerHTML='<div style="font-size:12px;opacity:0.5;">暫無排隊客人</div>';
      return;
    }
    queue.forEach(c=>{
      const div=document.createElement('div');
      div.className='queue-cust';
      div.innerHTML='<div class="face">'+c.face+'</div><div class="pbar"><i style="width:100%"></i></div>';
      div.dataset.id=c.id;
      queueEl.appendChild(div);
    });
  }

  // ---------- MAIN LOOP ----------
  let lastTick=null;
  function tick(ts){
    if(!running) return;
    if(lastTick==null) lastTick=ts;
    const dt = ts-lastTick;
    lastTick=ts;

    shiftMsLeft -= dt;
    if(shiftMsLeft<=0){ shiftMsLeft=0; endShift(); }

    if(current){
      current.patienceLeft -= dt;
      const ratio = Math.max(0, current.patienceLeft/current.patienceTotal);
      const fillEl = document.getElementById('curPatience');
      if(fillEl){
        fillEl.style.width=(ratio*100)+'%';
        fillEl.style.background = ratio<0.25?'var(--bad)':ratio<0.55?'#d9a53d':'var(--good)';
      }
      if(current.patienceLeft<=0){
        floatMsg('客人走了…','var(--bad)');
        loseCurrentToImpatience(current, true);
      }
    }
    queue.forEach(c=>{
      c.patienceLeft -= dt;
      const ratio = Math.max(0, c.patienceLeft/c.patienceTotal);
      const el = queueEl.querySelector('.queue-cust[data-id="'+c.id+'"] .pbar i');
      if(el){
        el.style.width=(ratio*100)+'%';
        el.style.background = ratio<0.25?'var(--bad)':ratio<0.55?'#d9a53d':'var(--good)';
      }
    });
    const leaving = queue.filter(c=>c.patienceLeft<=0);
    if(leaving.length){
      queue = queue.filter(c=>c.patienceLeft>0);
      leaving.forEach(()=>loseCurrentToImpatience(null,false));
      renderQueue();
    }

    renderHud();
    tickTimer = requestAnimationFrame(tick);
  }

  function endShift(){
    running=false;
    clearTimeout(spawnTimer);
    cancelAnimationFrame(tickTimer);
    $('#endMoney').textContent=money;
    $('#endServed').textContent=served;
    $('#endBestCombo').textContent=bestCombo;
    let comment='';
    if(rating>=4.6) comment='手藝精湛，街坊都愛你的蛋餅！明天繼續加油～';
    else if(rating>=3.5) comment='穩紮穩打的一天，客人大多滿意。';
    else if(rating>=2.2) comment='今天有點手忙腳亂，明天調整一下節奏吧！';
    else comment='客人等得不耐煩了…休息一下，明天重新出發！';
    $('#endComment').textContent=comment;
    $('#endTitle').textContent = 'Day '+day+' 打烊！';

    submitMsg.textContent='';
    submitMsg.className='submit-msg';
    submitScoreBtn.disabled=false;
    leaderboardBox.style.display='none';
    showLbBtn.textContent='查看排行榜 »';
    try{ nicknameInput.value = localStorage.getItem('eggCrepeNickname') || ''; }catch(e){}

    endOverlay.classList.add('show');
  }

  // ---------- LEADERBOARD ----------
  async function submitScore(){
    if(!API_BASE){
      submitMsg.textContent='尚未設定後端網址，暫時無法上傳分數';
      submitMsg.className='submit-msg err';
      return;
    }
    const nickname = (nicknameInput.value||'').trim();
    if(!nickname){
      submitMsg.textContent='請先輸入暱稱';
      submitMsg.className='submit-msg err';
      nicknameInput.focus();
      return;
    }
    submitScoreBtn.disabled=true;
    submitMsg.textContent='上傳中…';
    submitMsg.className='submit-msg';
    try{
      const res = await fetch(API_BASE+'/score', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({nickname, score:money, day})
      });
      const data = await res.json();
      if(data.ok){
        submitMsg.textContent='上傳成功！';
        submitMsg.className='submit-msg ok';
        try{ localStorage.setItem('eggCrepeNickname', nickname); }catch(e){}
        loadLeaderboard();
        loadSideLeaderboard();
        leaderboardBox.style.display='block';
        showLbBtn.textContent='收起排行榜 «';
      } else {
        submitMsg.textContent='上傳失敗：'+(data.error||'未知錯誤');
        submitMsg.className='submit-msg err';
        submitScoreBtn.disabled=false;
      }
    }catch(err){
      submitMsg.textContent='連線失敗，稍後再試';
      submitMsg.className='submit-msg err';
      submitScoreBtn.disabled=false;
    }
  }

  async function loadLeaderboard(){
    if(!API_BASE){
      lbList.innerHTML='<div class="lb-empty">尚未設定後端網址</div>';
      return;
    }
    lbList.innerHTML='<div class="lb-empty">載入中…</div>';
    try{
      const res = await fetch(API_BASE+'/leaderboard?limit=10');
      const data = await res.json();
      if(!data.ok || !data.leaderboard || !data.leaderboard.length){
        lbList.innerHTML='<div class="lb-empty">目前還沒有紀錄，當第一名吧！</div>';
        return;
      }
      lbList.innerHTML='';
      data.leaderboard.forEach(row=>{
        const li=document.createElement('li');
        li.innerHTML='<span class="n">'+escapeHtml(row.nickname)+'</span><span class="s">$'+row.score+'</span>';
        lbList.appendChild(li);
      });
    }catch(err){
      lbList.innerHTML='<div class="lb-empty">載入失敗，稍後再試</div>';
    }
  }

  async function loadSideLeaderboard(){
    if(!sideLbList) return;
    if(!API_BASE){
      sideLbList.innerHTML='<li class="lb-empty-row">尚未設定後端網址</li>';
      return;
    }
    try{
      const res = await fetch(API_BASE+'/leaderboard?limit=10&scope=today');
      const data = await res.json();
      if(!data.ok || !data.leaderboard || !data.leaderboard.length){
        sideLbList.innerHTML='<li class="lb-empty-row">今天還沒有紀錄</li>';
        return;
      }
      sideLbList.innerHTML='';
      data.leaderboard.forEach((row,i)=>{
        const li=document.createElement('li');
        li.innerHTML='<span class="n">'+(i+1)+'. '+escapeHtml(row.nickname)+'</span><span class="s">$'+row.score+'</span>';
        sideLbList.appendChild(li);
      });
    }catch(err){
      sideLbList.innerHTML='<li class="lb-empty-row">載入失敗</li>';
    }
  }

  let sideLbTimer=null;
  function startSideLbPolling(){
    loadSideLeaderboard();
    clearInterval(sideLbTimer);
    sideLbTimer=setInterval(loadSideLeaderboard, 20000);
  }

  function escapeHtml(s){
    const d=document.createElement('div');
    d.textContent = String(s);
    return d.innerHTML;
  }

  function startShift(){
    running=true;
    shiftMsLeft=SHIFT_SECONDS*1000;
    comboCount=0; served=0; bestCombo=0;
    queue=[]; current=null;
    resetPancake();
    renderQueue(); renderTicket(); renderHud();
    lastTick=null;
    scheduleSpawn();
    // seed one immediate customer
    queue.push(makeOrder());
    renderQueue();
    promoteQueue();
    tickTimer=requestAnimationFrame(tick);
  }

  // ---------- EVENTS ----------
  controlsEl.addEventListener('click', e=>{
    const btn=e.target.closest('.btn');
    if(!btn || btn.disabled) return;
    doAction(btn.dataset.act, btn.dataset.key);
  });

  $('#startBtn').addEventListener('click', ()=>{
    startOverlay.classList.remove('show');
    money=0; day=1; rating=5;
    startShift();
  });
  $('#restartBtn').addEventListener('click', ()=>{
    endOverlay.classList.remove('show');
    day+=1;
    startShift();
  });

  submitScoreBtn.addEventListener('click', submitScore);
  nicknameInput.addEventListener('keydown', e=>{ if(e.key==='Enter') submitScore(); });
  showLbBtn.addEventListener('click', ()=>{
    const willShow = leaderboardBox.style.display==='none';
    leaderboardBox.style.display = willShow?'block':'none';
    showLbBtn.textContent = willShow?'收起排行榜 «':'查看排行榜 »';
    if(willShow) loadLeaderboard();
  });

  // init
  renderHud();
  updateButtons();
  startSideLbPolling();
})();
</script>
</body>
</html>
